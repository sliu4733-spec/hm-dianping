<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>黑马点评</title>
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/index.css" rel="stylesheet">
  <link href="./css/main.css" rel="stylesheet">
  <style>
    .el-input__inner { border-radius: 20px; }
    .city-picker { position: absolute; top: 50px; left: 0; right: 0; background: #fff; z-index: 1001; box-shadow: 0 4px 12px rgba(0,0,0,.12); padding: 12px; }
    .city-title { display: flex; justify-content: space-between; align-items: center; font-weight: bold; margin-bottom: 8px; }
    .locate-btn { border: 1px solid #ff6633; color: #ff6633; background: #fff; border-radius: 14px; padding: 4px 10px; font-size: 12px; }
    .city-chip { display: inline-block; padding: 6px 14px; margin: 4px; border-radius: 16px; cursor: pointer; font-size: 13px; }
  </style>
</head>
<body>
<div id="app">
  <div class="search-bar">
    <div class="city-btn" @click.stop="toggleCityPicker">{{ city }} <i class="el-icon-arrow-down"></i></div>
    <div class="search-input">
      <el-input size="mini" v-model="searchText" placeholder="请输入商户名、地点" @keyup.enter.native="searchShop">
        <i slot="prefix" class="el-input__icon el-icon-search"></i>
      </el-input>
    </div>
    <div class="header-icon" @click="toPage(4)"><i class="el-icon-user"></i></div>
  </div>

  <div v-if="showCityPicker" class="city-picker" @click.stop>
    <div class="city-title">
      <span>选择位置</span>
      <button class="locate-btn" @click="useCurrentLocation">使用当前位置</button>
    </div>
    <span
      v-for="c in cities"
      :key="c.name"
      class="city-chip"
      @click="selectCity(c.name)"
      :style="{background: c.name === city ? '#ff6633' : '#f5f5f5', color: c.name === city ? '#fff' : '#333'}"
    >{{ c.name }}</span>
  </div>

  <div class="type-list">
    <div class="type-box" v-for="t in types" :key="t.id" @click="toShopList(t.id, t.name)">
      <div class="type-view"><img :src="'/imgs/' + t.icon" alt=""></div>
      <div class="type-text">{{ t.name }}</div>
    </div>
  </div>

  <div class="blog-list" @scroll="onScroll">
    <div class="blog-box" v-for="b in blogs" :key="b.id">
      <div class="blog-img" @click="toBlogDetail(b)"><img :src="b.img" alt=""></div>
      <div class="blog-title">{{ b.title }}</div>
      <div class="blog-foot">
        <div class="blog-user-icon"><img :src="b.icon || '/imgs/icons/default-icon.png'" alt=""></div>
        <div class="blog-user-name">{{ b.name }}</div>
        <div class="blog-liked" @click="addLike(b)">
          <i class="el-icon-thumb"></i>
          {{ b.liked }}
        </div>
      </div>
    </div>
  </div>
  <foot-bar :active-btn="1"></foot-bar>
</div>

<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js?v=20260614fix2"></script>
<script src="./js/location.js?v=20260614fix2"></script>
<script src="./js/footer.js?v=20260614fix2"></script>
<script>
  new Vue({
    el: "#app",
    data: {
      isReachBottom: false,
      types: [],
      blogs: [],
      current: 1,
      city: "杭州",
      cities: UserLocation.cities,
      showCityPicker: false,
      searchText: ""
    },
    created() {
      var self = this;
      UserLocation.init(function(loc) {
        self.city = loc.city;
      }, false);
      this.queryTypes();
      this.queryHotBlogsScroll();
    },
    methods: {
      toggleCityPicker() {
        this.showCityPicker = !this.showCityPicker;
      },
      selectCity(c) {
        UserLocation.selectCity(c);
        this.city = UserLocation.city;
        this.showCityPicker = false;
        this.$message.success("已切换到 " + this.city);
      },
      useCurrentLocation() {
        var self = this;
        UserLocation.init(function(loc) {
          self.city = loc.city;
          self.showCityPicker = false;
          self.$message.success("定位已更新");
        }, true);
      },
      queryTypes() {
        axios.get("/shop-type/list")
          .then((res) => { this.types = res.data || []; })
          .catch((err) => { this.$message.error(err); });
      },
      queryHotBlogsScroll() {
        axios.get("/blog/hot?current=" + this.current)
          .then((res) => {
            const rows = res.data || [];
            rows.forEach(b => b.img = b.images ? b.images.split(",")[0] : "");
            this.blogs = this.blogs.concat(rows);
          })
          .catch((err) => { this.$message.error(err); });
      },
      addLike(b) {
        axios.put("/blog/like/" + b.id)
          .then(() => { this.queryBlogById(b); })
          .catch((err) => { this.$message.error(err); });
      },
      queryBlogById(b) {
        axios.get("/blog/" + b.id)
          .then((res) => {
            b.liked = res.data.liked;
            b.isLike = res.data.isLike;
          })
          .catch(() => { b.liked++; });
      },
      onScroll(e) {
        let scrollTop = e.target.scrollTop;
        let offsetHeight = e.target.offsetHeight;
        let scrollHeight = e.target.scrollHeight;
        if (scrollTop + offsetHeight > scrollHeight && !this.isReachBottom) {
          this.isReachBottom = true;
          this.current++;
          this.queryHotBlogsScroll();
        } else {
          this.isReachBottom = false;
        }
      },
      toShopList(id, name) {
        location.href = "/shop-list.html?type=" + id + "&name=" + encodeURIComponent(name) + "&v=20260614fix3";
      },
      searchShop() {
        const keyword = this.searchText.trim();
        if (!keyword) return;
        location.href = "/shop-list.html?type=1&name=" + encodeURIComponent(keyword) + "&search=" + encodeURIComponent(keyword) + "&v=20260614fix3";
      },
      toBlogDetail(b) {
        location.href = "/blog-detail.html?id=" + b.id;
      },
      toPage(i) {
        if (i === 4) location.href = "/info.html";
      }
    }
  });
</script>
</body>
</html>
