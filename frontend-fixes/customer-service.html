<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>黑马点评 - 智能客服</title>
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html, #app { height: 100%; }
    .chat-wrap { display: flex; flex-direction: column; height: 100%; background: #f0f2f5; }
    .chat-header { height: 50px; background: linear-gradient(135deg, #ff6633, #ff8c5a); color: #fff; display: flex; align-items: center; padding: 0 14px; justify-content: space-between; flex-shrink: 0; }
    .back { font-size: 20px; cursor: pointer; width: 44px; }
    .title { font-size: 17px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; background: #4cff4c; border-radius: 50%; }
    .location { max-width: 62px; font-size: 11px; opacity: .9; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .chat-body { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
    .quick-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0 8px; justify-content: center; }
    .quick-actions span { background: #fff; color: #ff6633; border: 1px solid #ff6633; border-radius: 16px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
    .chat-msg { display: flex; align-items: flex-start; gap: 10px; max-width: 88%; }
    .chat-msg.self { align-self: flex-end; flex-direction: row-reverse; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .self .avatar { background: #ffd4c2; }
    .bot .avatar { background: #fff; border: 2px solid #ff6633; }
    .bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
    .bot .bubble { background: #fff; border-top-left-radius: 4px; color: #333; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
    .self .bubble { background: #ff6633; color: #fff; border-top-right-radius: 4px; }
    .time { font-size: 11px; color: #999; margin-top: 2px; }
    .self .time { text-align: right; }
    .typing-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #bbb; animation: blink 1.4s infinite both; margin: 0 2px; }
    .typing-dot:nth-child(2) { animation-delay: .2s; }
    .typing-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100% { opacity: 0; } 40% { opacity: 1; } }
    .chat-input-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #fff; border-top: 1px solid #e8e8e8; flex-shrink: 0; }
    .chat-input-bar input { flex: 1; border: 1px solid #e0e0e0; border-radius: 22px; padding: 10px 16px; font-size: 14px; outline: none; background: #f5f5f5; }
    .chat-input-bar input:focus { border-color: #ff6633; background: #fff; }
    .chat-input-bar button { width: 42px; height: 42px; background: #ff6633; color: #fff; border: none; border-radius: 50%; font-size: 18px; cursor: pointer; flex-shrink: 0; }
    .chat-input-bar button:disabled { opacity: .5; }
    .tool-row { display: flex; gap: 8px; justify-content: center; }
    .tool-row button { border: 1px solid #eee; background: #fff; color: #666; border-radius: 14px; padding: 5px 10px; font-size: 12px; }
  </style>
</head>
<body>
<div id="app">
  <div class="chat-wrap">
    <div class="chat-header">
      <span class="back" @click="goBack">←</span>
      <span class="title"><span class="dot"></span>黑马智能客服 · 小黑</span>
      <span class="location" @click="refreshLocation">{{ locationText }}</span>
    </div>
    <div class="chat-body" ref="chatBody">
      <div v-if="messages.length === 0" class="chat-msg bot">
        <div class="avatar">AI</div>
        <div>
          <div class="bubble">你好，我是智能客服小黑。

我可以帮你查优惠券、查订单，也可以按距离和口味推荐附近店铺。
例如：我想吃火锅，附近10公里有没有推荐？</div>
        </div>
      </div>
      <div class="quick-actions" v-if="messages.length === 0">
        <span @click="quickAsk('附近10公里有没有火锅推荐')">附近火锅</span>
        <span @click="quickAsk('评分最高的美食店铺有哪些')">评分推荐</span>
        <span @click="quickAsk('有哪些店铺有优惠券')">优惠券查询</span>
        <span @click="quickAsk('我的订单')">订单查询</span>
      </div>
      <div class="tool-row" v-if="messages.length > 0">
        <button @click="clearHistory">清空聊天记录</button>
        <button @click="refreshLocation">重新定位</button>
      </div>
      <div v-for="(m, i) in messages" :key="i" :class="['chat-msg', m.role]">
        <div class="avatar">{{ m.role === 'self' ? '我' : 'AI' }}</div>
        <div style="min-width:0">
          <div class="bubble">{{ m.text }}</div>
          <div class="time">{{ m.time }}</div>
        </div>
      </div>
      <div v-if="loading" class="chat-msg bot">
        <div class="avatar">AI</div>
        <div class="bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>
      </div>
    </div>
    <div class="chat-input-bar">
      <input v-model="inputText" placeholder="输入你的问题..." @keyup.enter="send" maxlength="200">
      <button @click="send" :disabled="!inputText.trim() || loading">➤</button>
    </div>
  </div>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/location.js?v=20260614fix3"></script>
<script src="./js/common.js?v=20260614fix3"></script>
<script>
  const CHAT_HISTORY_KEY = "hm_ai_chat_history";

  new Vue({
    el: "#app",
    data: {
      messages: [],
      inputText: "",
      loading: false,
      locationText: "定位中..."
    },
    created() {
      this.loadHistory();
      this.initLocation(false);
    },
    mounted() {
      this.$nextTick(this.scrollBottom);
    },
    methods: {
      initLocation(forceGps) {
        var self = this;
        UserLocation.init(function(loc) {
          self.locationText = loc.detected ? loc.city : loc.city;
        }, forceGps);
      },
      refreshLocation() {
        this.locationText = "定位中...";
        localStorage.removeItem("user_location");
        this.initLocation(true);
      },
      quickAsk(question) {
        this.inputText = question;
        this.send();
      },
      send() {
        var text = this.inputText.trim();
        if (!text || this.loading) return;
        this.messages.push({ role: "self", text: text, time: this.now() });
        this.saveHistory();
        this.inputText = "";
        this.loading = true;
        this.$nextTick(this.scrollBottom);

        var self = this;
        axios.post("/ai/chat", {
          message: text,
          lat: UserLocation.lat,
          lng: UserLocation.lng,
          city: UserLocation.city,
          detected: UserLocation.detected
        }).then(function(resp) {
          var reply = resp.data || resp;
          self.messages.push({ role: "bot", text: reply, time: self.now() });
          self.saveHistory();
        }).catch(function(err) {
          var msg = typeof err === "string" ? err : "服务暂时不可用，请稍后再试";
          self.messages.push({ role: "bot", text: msg, time: self.now() });
          self.saveHistory();
        }).finally(function() {
          self.loading = false;
          self.$nextTick(self.scrollBottom);
        });
      },
      loadHistory() {
        try {
          this.messages = JSON.parse(localStorage.getItem(CHAT_HISTORY_KEY) || "[]");
        } catch (e) {
          this.messages = [];
        }
      },
      saveHistory() {
        localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(this.messages.slice(-60)));
      },
      clearHistory() {
        this.messages = [];
        localStorage.removeItem(CHAT_HISTORY_KEY);
      },
      scrollBottom() {
        var el = this.$refs.chatBody;
        if (el) el.scrollTop = el.scrollHeight;
      },
      now() {
        var d = new Date();
        return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
      },
      goBack() {
        if (window.history.length > 1) window.history.back();
        else location.href = "/index.html";
      }
    }
  });
</script>
</body>
</html>
