server:
  port: 8081
  tomcat:
    max-connections: 2000
    max-threads: 400
    min-spare-threads: 50
    accept-count: 500
    connection-timeout: 2000ms

spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/hmdp?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:1234}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:123456}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:1234}
    lettuce:
      pool:
        enabled: true
        max-active: 50
        max-idle: 20
        min-idle: 10
        max-wait: 2000ms
      timeout: 5000ms
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  type-aliases-package: com.hmdp.entity

logging:
  level:
    com.hmdp: debug
  pattern:
    dateformat: mm:ss.SSS

canal:
  enabled: false
  server:
    host: ${CANAL_HOST:127.0.0.1}
    port: ${CANAL_PORT:11111}
  destination: example
  subscribe:
    filter: hmdp\\.tb_seckill_voucher,hmdp\\.tb_voucher_order

spring.cloud.sentinel.transport:
  dashboard: 127.0.0.1:8080
  port: 8719

seckill:
  mq:
    concurrent-consumers: 4
    max-concurrent-consumers: 8
    prefetch: 20

ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    temperature: 0.3

amap:
  web-key: ${AMAP_WEB_KEY:}
  place-around-url: ${AMAP_PLACE_AROUND_URL:https://restapi.amap.com/v3/place/around}
  default-radius-meters: 10000
  cache-ttl-minutes: 30
